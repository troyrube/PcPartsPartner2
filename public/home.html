<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Parts Partner</title>

    <style>
        body {
            margin: 0;
            font-family: "Gill Sans", "Gill Sans MT", Calibri, sans-serif;
            background-color: rgb(221, 238, 245);
        }

        .header {
            min-height: 100px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 30px;
            box-sizing: border-box;
        }

        .logo { height: 80px; cursor: pointer; }

        .search {
            flex: 1;
            max-width: 400px;
            min-width: 180px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        .header-buttons { display: flex; flex-wrap: wrap; gap: 8px; }

        .header-buttons button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background-color: rgb(240, 240, 240);
            cursor: pointer;
            font-size: 15px;
        }

        .header-buttons button:hover { background-color: lightgray; }

        .main { display: flex; }

        .sidebar {
            width: 220px;
            background-color: white;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .sidebar h2 { margin-top: 0; }

        .category {
            display: block;
            padding: 10px;
            margin-bottom: 10px;
            background-color: rgb(240, 240, 240);
            border-radius: 5px;
            cursor: pointer;
        }

        .category:hover, .category.active { background-color: lightgray; }

        .products {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            align-content: start;
        }

        .card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .card img { width: 100%; height: 180px; object-fit: contain; }
        .price { font-size: 22px; font-weight: bold; }

        .cart-button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: grey;
            cursor: pointer;
        }

        .cart-button:hover { background-color: rgb(120, 120, 120); }
        .cart-button:disabled { background-color: rgb(210, 210, 210); cursor: not-allowed; }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            color: gray;
            font-size: 18px;
            margin-top: 40px;
        }

        .placeholder .ph-img { height: 180px; background: rgb(235, 235, 235); border-radius: 6px; }
        .placeholder .ph-line { height: 16px; background: rgb(235, 235, 235); border-radius: 4px; margin: 14px auto 0 auto; }
        .placeholder .ph-line.short { width: 50%; }
        .placeholder .ph-btn { height: 36px; background: rgb(225, 225, 225); border-radius: 5px; margin-top: 16px; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(60, 60, 60, 0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .overlay.show { display: flex; }

        .modal {
            display: none;
            background-color: white;
            width: 360px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .modal.show { display: block; }
        .modal img { height: 90px; width: auto; }
        .modal h2 { margin: 10px 0 15px 0; }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 5px;
            border: 1px solid gray;
            font-size: 16px;
            box-sizing: border-box;
        }

        .modal .primary-btn {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: rgb(180, 220, 235);
        }

        .modal .primary-btn:hover { background-color: rgb(150, 200, 220); }
        .modal .switch-text { margin-top: 18px; font-size: 15px; color: rgb(80, 80, 80); }

        .modal .switch-link {
            border: none;
            background: none;
            color: rgb(30, 90, 140);
            cursor: pointer;
            font-size: 15px;
            text-decoration: underline;
            padding: 0;
        }

        .modal .error-message { color: rgb(180, 40, 40); font-size: 14px; min-height: 18px; margin: 8px 0 0 0; }
        .modal .success-message { color: rgb(30, 110, 30); font-size: 14px; margin: 8px 0 0 0; }

        .sort-box { margin-top: 20px; }
        .sort-box label { display: block; font-weight: bold; margin-bottom: 6px; }
        .sort-box select { width: 100%; padding: 9px; border-radius: 5px; border: 1px solid gray; font-size: 15px; background: white; }

        @media (max-width: 1100px) {
            .products { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 800px) {
            .header { padding: 10px 15px; justify-content: center; }
            .logo { height: 60px; }
            .search { order: 3; max-width: none; width: 100%; flex-basis: 100%; }
            .main { flex-direction: column; }
            .sidebar { width: 100%; min-height: 0; padding: 12px 15px; display: flex; gap: 8px; overflow-x: auto; }
            .sidebar h2 { display: none; }
            .category { margin: 0; white-space: nowrap; }
            .sort-box { margin: 0 0 0 8px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
            .sort-box label { margin: 0; }
            .sort-box select { width: auto; }
            .products { grid-template-columns: repeat(2, 1fr); padding: 12px; gap: 12px; }
        }

        @media (max-width: 480px) {
            .products { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <div class="header">
        <img class="logo" src="Images/Logo.jpg" alt="Logo" onclick="window.location.href='home.html'">

        <input class="search" id="searchInput" type="text" placeholder="Search for parts...">

        <div class="header-buttons">
            <button id="adminButton" style="display:none" onclick="window.location.href='admin.html'">Admin</button>
            <button onclick="window.location.href='orders.html'">My Orders</button>
            <button onclick="window.location.href='cart.html'">Cart (<span id="cartCount">0</span>)</button>
            <button id="authButton"></button>
        </div>
    </div>

    <div class="main">
        <div class="sidebar">
            <h2>Categories</h2>
            <div class="category active" data-category="All">All</div>
            <div class="category" data-category="GPU">GPU</div>
            <div class="category" data-category="CPU">CPU</div>
            <div class="category" data-category="Motherboard">Motherboard</div>
            <div class="category" data-category="RAM">RAM</div>
            <div class="category" data-category="Cases">Cases</div>
            <div class="category" data-category="PSU">PSU</div>
            <div class="category" data-category="Other">Other</div>

            <div class="sort-box">
                <label for="sortSelect">Sort by price</label>
                <select id="sortSelect">
                    <option value="default">Newest first</option>
                    <option value="asc">Price: low to high</option>
                    <option value="desc">Price: high to low</option>
                </select>
            </div>
        </div>

        <div class="products" id="productsGrid"></div>
    </div>

    <div class="overlay" id="authOverlay">

        <div class="modal" id="loginModal">
            <img src="Images/Logo.jpg" alt="PC Parts Partner Logo">
            <h2>Login</h2>
            <input type="text" id="txtUsernameLogin" placeholder="Username" autocomplete="username">
            <input type="password" id="txtPasswordLogin" placeholder="Password" autocomplete="current-password">
            <button class="primary-btn" onclick="login()">Login</button>
            <p class="error-message" id="loginError"></p>
            <p class="switch-text">
                Don't have an account?
                <button class="switch-link" onclick="showModal('registerModal')">Register</button>
            </p>
        </div>

        <div class="modal" id="registerModal">
            <img src="Images/Logo.jpg" alt="PC Parts Partner Logo">
            <h2>Create Account</h2>
            <input type="text" id="txtUsernameRegister" placeholder="Username" autocomplete="username">
            <input type="text" id="txtCellphoneRegister" placeholder="Cellphone e.g. 0821234567" autocomplete="tel">
            <input type="password" id="txtPasswordRegister" placeholder="Password (8+ characters)" autocomplete="new-password">
            <button class="primary-btn" onclick="register()">Register</button>
            <p class="error-message" id="registerError"></p>
            <p class="success-message" id="registerSuccess"></p>
            <p class="switch-text">
                Already have an account?
                <button class="switch-link" onclick="showModal('loginModal')">Login</button>
            </p>
        </div>

        <div class="modal" id="codeModal">
            <img src="Images/Logo.jpg" alt="PC Parts Partner Logo">
            <h2>Verify It's You</h2>
            <p>We sent a code to your cellphone.</p>
            <input type="text" id="txtCode" placeholder="Enter code" inputmode="numeric" autocomplete="one-time-code">
            <button class="primary-btn" onclick="verifyCode()">Verify</button>
            <p class="error-message" id="verifyError"></p>
            <p class="switch-text">
                <button class="switch-link" onclick="showModal('loginModal')">Back to login</button>
            </p>
        </div>

    </div>

    <script>
        let allProducts = [];
        let activeCategory = 'All';
        let sortOrder = 'default';
        let currentUser = null;

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        async function postJson(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body || {}),
            });
            const data = await response.json().catch(() => ({}));
            return { ok: response.ok, data };
        }

        function showModal(id) {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
            document.getElementById(id).classList.add('show');
            document.getElementById('authOverlay').classList.add('show');
        }

        function hideAuth() {
            document.getElementById('authOverlay').classList.remove('show');
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
        }

        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    currentUser = (await response.json()).user;
                } else {
                    currentUser = null;
                }
            } catch (e) {
                currentUser = null;
            }

            if (currentUser) {
                hideAuth();
                loadProducts();
            } else {
                allProducts = [];
                renderPlaceholders();
                showModal('loginModal');
            }
            updateAuthButton();
        }

        function updateAuthButton() {
            const btn = document.getElementById('authButton');
            document.getElementById('adminButton').style.display =
                currentUser && currentUser.isAdmin ? 'inline-block' : 'none';

            if (currentUser) {
                btn.textContent = `Log out (${currentUser.username})`;
                btn.onclick = async () => {
                    await postJson('/api/auth/logout');
                    checkAuth();
                };
            } else {
                btn.textContent = 'Login';
                btn.onclick = () => showModal('loginModal');
            }
        }

        async function login() {
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            const username = document.getElementById('txtUsernameLogin').value.trim();
            const password = document.getElementById('txtPasswordLogin').value;
            if (!username || !password) {
                errorEl.textContent = 'Please enter your username and password.';
                return;
            }

            try {
                const { ok, data } = await postJson('/api/auth/login', { username, password });
                if (!ok) {
                    errorEl.textContent = data.error || 'Login failed.';
                    return;
                }
                document.getElementById('txtPasswordLogin').value = '';

                if (data.requires2fa) {
                    showModal('codeModal');   
                } else {
                    checkAuth();
                }
            } catch (err) {
                errorEl.textContent = 'Something went wrong. Please try again.';
                console.error(err);
            }
        }

        async function verifyCode() {
            const errorEl = document.getElementById('verifyError');
            errorEl.textContent = '';
            const code = document.getElementById('txtCode').value.trim();
            if (!code) {
                errorEl.textContent = 'Please enter the code.';
                return;
            }

            try {
                const { ok, data } = await postJson('/api/telesign/verify-code', { code });
                if (!ok) {
                    errorEl.textContent = data.error || 'Incorrect code. Please try again.';
                    return;
                }
                document.getElementById('txtCode').value = '';
                checkAuth();
            } catch (err) {
                errorEl.textContent = 'Something went wrong. Please try again.';
                console.error(err);
            }
        }

        async function register() {
            const errorEl = document.getElementById('registerError');
            const successEl = document.getElementById('registerSuccess');
            errorEl.textContent = '';
            successEl.textContent = '';

            const username = document.getElementById('txtUsernameRegister').value.trim();
            const cellphone = document.getElementById('txtCellphoneRegister').value.trim();
            const password = document.getElementById('txtPasswordRegister').value;

            if (!username || !cellphone || !password) {
                errorEl.textContent = 'Please fill in all fields.';
                return;
            }
            if (password.length < 8) {
                errorEl.textContent = 'Password should be at least 8 characters.';
                return;
            }

            try {
                const { ok, data } = await postJson('/api/auth/register', { username, cellphone, password });
                if (!ok) {
                    errorEl.textContent = data.error || 'Registration failed.';
                    return;
                }
                successEl.textContent = 'Account created! Taking you to login...';
                setTimeout(() => {
                    document.getElementById('txtUsernameLogin').value = username;
                    document.getElementById('txtPasswordRegister').value = '';
                    showModal('loginModal');
                }, 1200);
            } catch (err) {
                errorEl.textContent = 'Something went wrong. Please try again.';
                console.error(err);
            }
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            document.getElementById('cartCount').textContent =
                cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        function renderPlaceholders() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 8; i++) {
                const card = document.createElement('div');
                card.className = 'card placeholder';
                card.innerHTML = '<div class="ph-img"></div><div class="ph-line"></div><div class="ph-line short"></div><div class="ph-btn"></div>';
                grid.appendChild(card);
            }
        }

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '<p class="empty-message">Loading products...</p>';
            try {
                const response = await fetch('/api/products');
                if (response.status === 401) { currentUser = null; checkAuth(); return; }
                const data = await response.json();
                allProducts = data.products || [];
                renderProducts();
            } catch (err) {
                grid.innerHTML = '<p class="empty-message">Could not load products right now.</p>';
                console.error(err);
            }
        }

        function renderProducts() {
            if (!currentUser) return;
            const grid = document.getElementById('productsGrid');
            const term = document.getElementById('searchInput').value.trim().toLowerCase();

            const filtered = allProducts.filter(p =>
                (activeCategory === 'All' || p.category === activeCategory) &&
                (!term || p.name.toLowerCase().includes(term))
            );

            if (sortOrder === 'asc') filtered.sort((a, b) => Number(a.price) - Number(b.price));
            if (sortOrder === 'desc') filtered.sort((a, b) => Number(b.price) - Number(a.price));

            if (filtered.length === 0) {
                grid.innerHTML = '<p class="empty-message">No products found.</p>';
                return;
            }

            grid.innerHTML = '';
            filtered.forEach(p => {
                const soldOut = p.stock <= 0;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${esc(p.image_url || 'Images/Logo.jpg')}" alt="${esc(p.name)}">
                    <h3>${esc(p.name)}</h3>
                    <p class="price">R${Number(p.price).toLocaleString('en-ZA', { minimumFractionDigits: 2 })}</p>
                    <button class="cart-button" ${soldOut ? 'disabled' : ''}>${soldOut ? 'Out of stock' : 'Add to Cart'}</button>
                `;
                card.querySelector('button').addEventListener('click', () => addToCart(p.id));
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image_url || 'Images/Logo.jpg',
                    quantity: 1,
                });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }

        document.querySelectorAll('.category').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                activeCategory = el.dataset.category;
                renderProducts();
            });
        });

        document.getElementById('searchInput').addEventListener('input', renderProducts);
        document.getElementById('sortSelect').addEventListener('change', e => {
            sortOrder = e.target.value;
            renderProducts();
        });

        updateCartCount();
        renderPlaceholders();
        checkAuth();
    </script>

</body>

</html>
